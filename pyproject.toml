[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-tools"
version = "0.2.0"
description = "SymPy operations on population-dynamics expressions (moments, rates), with Python and LaTeX output."
requires-python = ">=3.10"
# latex-preview (github.com/leec13/latex-preview) is also required. It is not on PyPI,
# so it is not listed here: install it with `pip install -e ../latex-preview` (see README).
dependencies = ["PySide6>=6.6", "PyMuPDF>=1.24", "sympy>=1.12", "antlr4-python3-runtime==4.11.*"]

[project.gui-scripts]
sympy-tools = "sympy_tools.app:main"

[tool.setuptools.packages.find]
include = ["sympy_tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
